    last_reviewed: "2026-08-07"
    evidence:
      - date: "2026-08-07"
        type: first-real-use
        notes: >
          Built on the second dated occurrence of "_Improvements/ piled up
          with no review cadence and needed a full reconciliation pass"
          (occurrence #1: 2026-07-29, see
          _Improvements/Done/2026-07-29-baseline-consolidation-manifest.md;
