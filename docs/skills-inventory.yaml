          Skill audit found this local skill was a thin rewrite of the imported
          tdd skill with an overlapping trigger surface ("implementing a
          feature ... one behavior at a time" vs "test-first development").
          Weaker models picking the thin variant lost the full anti-horizontal-
          slicing methodology and reference docs. Retired in favor of tdd; see
          ai-toolkit docs/adr/0002-no-parallel-thin-skill-variants.md.
    next_action: >
      None. Do not recreate; route the trigger to tdd.

