    trigger: >
      Retired. Was: implement a feature or refactor one verifiable behavior at
      a time with a short feedback loop.
    canonical_repo: ai-toolkit
    canonical_path: removed on 2026-07-03 (was skills/engineering/ship-vertical-slice/SKILL.md)
    owner: Justin
    last_reviewed: "2026-07-03"
    evidence:
